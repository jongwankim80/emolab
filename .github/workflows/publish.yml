name: Build and publish Quarto site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install content build dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Generate people and publication content
        run: python scripts/build_content.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - name: Render site
        id: render
        shell: bash
        run: |
          set +e
          quarto render > render.log 2>&1
          status=$?
          cat render.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report render failure
        if: steps.render.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Automated diagnostic from workflow run %s.\n\n```text\n' "$GITHUB_RUN_ID" > issue-body.md
          cat render.log >> issue-body.md
          printf '\n```\n' >> issue-body.md
          gh issue create --title "Quarto render diagnostic - run $GITHUB_RUN_ID" --body-file issue-body.md
          exit 1

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.render.outputs.status == '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
