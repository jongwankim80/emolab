join:
  intro:
    eyebrow: Join EmoLab
    text: We welcome students who are curious about emotion, neuroscience, and
      quantitative methods, and who want to learn research by doing it.
  graduate:
    title: Prospective Graduate Students
    text: Graduate students in EmoLab are expected to take increasing ownership of
      research questions, experimental design, data analysis, and scientific
      writing. Prior coding/programming experience is helpful but not required;
      willingness to learn quantitative methods is required.
    contact_text: If you are considering graduate study, send a short introduction,
      your research interests, and a CV or transcript to
  undergraduate:
    title: Undergraduate Researchers
    text: Undergraduate researchers typically begin with behavioral experiments,
      reading and discussion, basic statistics, and MATLAB or related analysis
      tools before moving toward an independent project.
    contact_text: Students at Jeonbuk National University who are interested in
      joining the lab are welcome to inquire by email.
